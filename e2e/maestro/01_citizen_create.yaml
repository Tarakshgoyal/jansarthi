appId: com.rustedshader.jansarthi
name: Citizen signs up and reports an issue
---
- launchApp:
    clearKeychain: true
    permissions:
      all: allow
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: login-phone
    timeout: 30000
- tapOn:
    id: go-signup
- tapOn:
    id: signup-name
- inputText: E2E Citizen
- tapOn:
    id: signup-phone
- inputText: 9000000001
- tapOn: Create Account
- tapOn:
    id: signup-submit
- extendedWaitUntil:
    visible:
      id: otp-digit-0
    timeout: 15000
- tapOn:
    id: otp-digit-0
- inputText: 9
- tapOn:
    id: otp-digit-1
- inputText: 9
- tapOn:
    id: otp-digit-2
- inputText: 9
- tapOn:
    id: otp-digit-3
- inputText: 9
- tapOn:
    id: otp-digit-4
- inputText: 9
- tapOn:
    id: otp-digit-5
- inputText: 9
- tapOn:
    id: otp-submit
- extendedWaitUntil:
    visible:
      id: create-report
    timeout: 30000
- tapOn:
    id: create-report
- tapOn:
    id: issue-type-water
- extendedWaitUntil:
    visible: Your Location
    timeout: 30000
- scrollUntilVisible:
    element:
      id: locality-selector
    direction: DOWN
- tapOn:
    id: locality-selector
- extendedWaitUntil:
    visible:
      id: locality-option-1
    timeout: 15000
- tapOn:
    id: locality-option-1
- scrollUntilVisible:
    element:
      id: water-description
    direction: DOWN
- tapOn:
    id: water-description
- inputText: E2E mobile water leak near the public road
- scrollUntilVisible:
    element:
      id: report-camera-open
    direction: DOWN
- tapOn:
    id: report-camera-open
- assertVisible:
    id: report-camera-capture
- tapOn: Cancel
- scrollUntilVisible:
    element:
      id: water-submit
    direction: DOWN
- tapOn:
    id: water-submit
- extendedWaitUntil:
    visible: Water issue reported successfully!
    timeout: 30000
- tapOn: OK
- extendedWaitUntil:
    visible:
      id: profile-button
    timeout: 15000
- tapOn:
    id: profile-button
- tapOn:
    id: logout-button
- tapOn:
    point: 68%,56%
- assertVisible:
    id: login-phone
