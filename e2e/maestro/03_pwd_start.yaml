appId: com.rustedshader.jansarthi
name: PWD worker starts work and validates completion requirements
---
- launchApp
- tapOn:
    id: login-phone
- inputText: 9000000003
- tapOn: Welcome Back
- tapOn:
    id: login-submit
- tapOn:
    id: otp-digit-0
- inputText: 9
- tapOn:
    id: otp-digit-1
- inputText: 9
- tapOn:
    id: otp-digit-2
- inputText: 9
- tapOn:
    id: otp-digit-3
- inputText: 9
- tapOn:
    id: otp-digit-4
- inputText: 9
- tapOn:
    id: otp-digit-5
- inputText: 9
- tapOn:
    id: otp-submit
- extendedWaitUntil:
    visible:
      id: pwd-issue-1
    timeout: 30000
- tapOn:
    id: pwd-issue-1
- extendedWaitUntil:
    visible:
      id: pwd-start-work
    timeout: 15000
- tapOn:
    id: pwd-start-work
- tapOn:
    point: 68%,56%
- extendedWaitUntil:
    visible: Status updated successfully
    timeout: 15000
- tapOn: OK
- tapOn:
    id: pwd-show-completion
- scrollUntilVisible:
    element:
      id: pwd-completion-description
    direction: DOWN
- tapOn:
    id: pwd-completion-description
- inputText: Replaced the leaking pipe and verified pressure
- scroll
- tapOn:
    id: pwd-completion-submit
- assertVisible: Please take a photo of the completed work
- tapOn: OK
- tapOn:
    id: pwd-back
- tapOn:
    id: profile-button
- tapOn:
    id: logout-button
- tapOn:
    point: 68%,56%
- assertVisible:
    id: login-phone
