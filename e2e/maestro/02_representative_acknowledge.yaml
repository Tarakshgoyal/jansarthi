appId: com.rustedshader.jansarthi
name: Representative acknowledges the citizen issue
---
- launchApp
- extendedWaitUntil:
    visible:
      id: login-phone
    timeout: 15000
- tapOn:
    id: login-phone
- inputText: 9000000002
- tapOn: Welcome Back
- tapOn:
    id: login-submit
- tapOn:
    id: otp-digit-0
- inputText: 9
- tapOn:
    id: otp-digit-1
- inputText: 9
- tapOn:
    id: otp-digit-2
- inputText: 9
- tapOn:
    id: otp-digit-3
- inputText: 9
- tapOn:
    id: otp-digit-4
- inputText: 9
- tapOn:
    id: otp-digit-5
- inputText: 9
- tapOn:
    id: otp-submit
- extendedWaitUntil:
    visible:
      id: representative-issue-1
    timeout: 30000
- tapOn:
    id: representative-issue-1
- extendedWaitUntil:
    visible:
      id: representative-acknowledge
    timeout: 15000
- tapOn:
    id: representative-acknowledge
- tapOn:
    point: 50%,54%
- extendedWaitUntil:
    visible: Status updated successfully
    timeout: 15000
- tapOn: OK
- tapOn:
    id: back-button
- tapOn:
    id: profile-button
- tapOn:
    id: logout-button
- tapOn:
    point: 68%,56%
- assertVisible:
    id: login-phone
