name: Production API Smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Verify health and dependencies
        run: |
          curl --fail --silent --show-error https://api.jansarthi.shubhang.dev/health
          curl --fail --silent --show-error https://api.jansarthi.shubhang.dev/ready
