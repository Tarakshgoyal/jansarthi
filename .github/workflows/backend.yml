name: Backend CI and Deployment

on:
  pull_request:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      MINIO_ENDPOINT: localhost:9000
      MINIO_USER: admin
      MINIO_PASSWORD: YourPassword123
      MINIO_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        working-directory: jansarthi-core
        run: uv sync --locked
      - name: Compile backend
        working-directory: jansarthi-core
        run: uv run python -m compileall -q app scripts
      - name: Start isolated object storage
        run: |
          docker run --detach --name jansarthi-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=admin \
            --env MINIO_ROOT_PASSWORD=YourPassword123 \
            quay.io/minio/minio:latest server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs jansarthi-minio
          exit 1
      - name: Run complete API flow
        run: ./e2e/run_backend_e2e.sh

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install locked mobile dependencies
        working-directory: jansarthi-app
        run: bun install --frozen-lockfile
      - name: Type-check mobile application
        working-directory: jansarthi-app
        run: bunx tsc --noEmit
      - name: Lint mobile application
        working-directory: jansarthi-app
        run: bun run lint

  image:
    needs:
      - backend-test
      - mobile-test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Set image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jansarthi-api:${GITHUB_SHA}" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: jansarthi-core
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
      - name: Synchronize deployment configuration
        run: >-
          rsync --archive --delete
          deploy/Caddyfile deploy/docker-compose.yml deploy/release.sh
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/jansarthi/
      - name: Pull and activate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "chmod 750 /opt/jansarthi/release.sh && /opt/jansarthi/release.sh '$IMAGE'"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} docker logout ghcr.io
      - name: Verify public readiness
        run: |
          for attempt in {1..30}; do
            curl --fail --silent --show-error https://api.jansarthi.shubhang.dev/ready && exit 0
            sleep 2
          done
          exit 1
